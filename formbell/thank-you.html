<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-99m1m+Kja0yfX76dJfBJc5c6OBLTgKP6gS+nnMG+Hyo='; style-src 'sha256-kHMPS76e8itLlzC9lYot82CzSjKW6x4hfCAI3LpQRHQ='; img-src data:; font-src 'none'; connect-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<script>(()=>{
  'use strict';
  let query=location.search,clean=false;
  try{history.replaceState(null,'','/formbell/thank-you.html');clean=true}catch{query=''}
  const fallback='Check the email from Dodo Payments for your license key';
  function fitFields(){
    for(const field of document.querySelectorAll('#keys textarea')){
      field.rows=1;
      while(field.rows<20&&field.scrollHeight>field.clientHeight+2)field.rows++;
    }
  }
  function reset(){
    query='';
    for(const field of document.querySelectorAll('#keys textarea'))field.value='';
    document.getElementById('keys')?.replaceChildren();
    const panel=document.getElementById('licensePanel'),note=document.getElementById('fallback'),status=document.getElementById('copyStatus');
    if(panel)panel.hidden=true;
    if(note){note.hidden=false;note.textContent=fallback}
    if(status)status.textContent='';
  }
  function keysFromQuery(raw){
    if(!raw||new TextEncoder().encode(raw).length>8192||/%(?![0-9a-f]{2})/i.test(raw))return null;
    const params=new URLSearchParams(raw),seen=new Set();
    for(const [name,value]of params){
      if(seen.has(name)||/[\u0000-\u001f\u007f\ufffd]/u.test(name+value))return null;
      seen.add(name);
    }
    const status=params.get('status'),payment=params.get('payment_id'),subscription=params.get('subscription_id');
    if(status==='active'){
      if(!subscription||!subscription.trim()||params.has('payment_id'))return null;
    }else if(status==='succeeded'){
      if(!payment||!payment.trim()||params.has('subscription_id'))return null;
    }else return null;
    const supplied=params.get('license_key');
    if(!supplied)return null;
    const keys=supplied.split(',').map(key=>key.trim());
    if(keys.length>20||new Set(keys).size!==keys.length||keys.some(key=>!/^[A-Za-z0-9_-]{16,200}$/.test(key)))return null;
    return keys;
  }
  document.addEventListener('DOMContentLoaded',()=>{
    let keys=clean?keysFromQuery(query):null;
    query='';
    if(!keys)return;
    const container=document.getElementById('keys'),status=document.getElementById('copyStatus');
    for(let index=0;index<keys.length;index++){
      const row=document.createElement('div');row.className='key-row';
      const label=document.createElement('label'),field=document.createElement('textarea'),button=document.createElement('button');
      field.id='license-key-'+(index+1);field.readOnly=true;field.autocomplete='off';field.spellcheck=false;
      field.rows=Math.ceil(keys[index].length/20);field.value=keys[index];
      label.htmlFor=field.id;label.textContent=keys.length===1?'License key':'License key '+(index+1);
      button.type='button';button.className=keys.length===1?'primary':'secondary';button.textContent='Copy key';
      button.setAttribute('aria-label',keys.length===1?'Copy key':'Copy license key '+(index+1));
      button.addEventListener('click',async()=>{
        status.textContent='';
        if(!field.value)return;
        try{await navigator.clipboard.writeText(field.value);if(field.value)status.textContent='Copied.'}
        catch{if(field.value){field.focus();field.select();status.textContent='Select the key and copy it.'}}
      });
      row.append(label,field,button);container.append(row);
    }
    keys.fill('');keys=null;
    document.getElementById('fallback').hidden=true;document.getElementById('licensePanel').hidden=false;fitFields();
  },{once:true});
  addEventListener('resize',fitFields);
  addEventListener('pagehide',reset);
  addEventListener('pageshow',event=>{if(event.persisted)reset()});
})();</script>
<title>Your Formbell license key</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>*{box-sizing:border-box}html{color:#1c1c1e;background:#f7f7f8;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;padding:40px 16px}main{max-width:560px;margin:0 auto;padding:24px;background:#fff;border:1px solid #e2e2e5;border-radius:12px}.brand{font-size:16px;font-weight:700;display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{display:block;width:32px;height:32px;flex:none}h1{font-size:24px;line-height:32px;font-weight:650;margin:0 0 16px;text-wrap:balance}p{margin:0;color:#59616d;text-wrap:balance}.instructions{margin-bottom:24px}.key-row{display:grid;gap:8px;margin-top:16px}.key-row:first-child{margin-top:0}label{font-size:13px;font-weight:600}textarea{display:block;width:100%;padding:12px;border:1px solid #7a8493;border-radius:8px;resize:none;background:#fff;color:#1c1c1e;overflow-wrap:anywhere;word-break:break-all;white-space:pre-wrap;font:14px/22px ui-monospace,SFMono-Regular,Consolas,monospace}button{justify-self:end;min-height:40px;padding:8px 16px;border:1px solid #1c1c1e;border-radius:8px;font:600 14px/22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}.primary{background:#1c1c1e;color:#fff}.primary:hover{background:#333338}.primary:active{background:#101012}.secondary{background:#fff;color:#1c1c1e}.secondary:hover{background:#f1f2f4}.secondary:active{background:#e5e5e9}button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #ffb300;outline-offset:3px}a{color:#1c1c1e;text-decoration:underline}#copyStatus{font-size:13px;margin-top:16px;min-height:20px}.help{font-size:13px;margin-top:16px}#fallback{color:#1c1c1e}[hidden]{display:none!important}@media(max-width:400px){body{padding:24px 16px}main{padding:24px 16px}h1{font-size:22px;line-height:30px}}</style>
</head>
<body>
<main>
<div class="brand"><svg class="mark" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512"><rect width="64" height="64" rx="14" fill="#1C1C1E"/><g transform="translate(-1 0)"><path d="M19 50V27A13 13 0 0 1 32 14H47V25H34A4 4 0 0 0 30 29V50Z" fill="#F7F5F0"/><path d="M30 31H45A15 15 0 0 1 30 46Z" fill="#FFB300"/></g></svg><span>Formbell</span></div>
<p id="fallback">Check the email from Dodo Payments for your license key</p>
<section id="licensePanel" hidden aria-labelledby="licenseTitle">
<h1 id="licenseTitle">Your Formbell license key</h1>
<p class="instructions">Copy your key, then open Plan in Formbell and choose Connect license.</p>
<div id="keys"></div>
<p id="copyStatus" role="status" aria-live="polite"></p>
<p class="help"><a href="/formbell/help/personalized-confirmation-email.html" rel="noreferrer">Help</a></p>
</section>
</main>
</body>
</html>
